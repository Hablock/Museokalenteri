<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <title>Helsingin seudun taidenäyttelyt</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Helsingin seudun taidenäyttelyt - selaa ja suodata museoiden näyttelyitä" />
  
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://museokalenteri.fi/" />
  <meta property="og:title" content="Helsingin seudun Museokalenteri" />
  <meta property="og:description" content="Helsingin seudun taidenäyttelyt - selaa ja suodata museoiden näyttelyitä" />
  <meta property="og:image" content="https://hablock.github.io/Museokalenteri/img/museokalenteri_og_image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="628" />
  <meta property="og:image:alt" content="Helsingin seudun Museokalenteri" />
  <meta property="og:locale" content="fi_FI" />
  <meta property="og:site_name" content="Helsingin seudun Museokalenteri" />
  
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Helsingin seudun Museokalenteri" />
  <meta name="twitter:description" content="Helsingin seudun taidenäyttelyt - selaa ja suodata museoiden näyttelyitä" />
  <meta name="twitter:image" content="./img/museokalenteri_logo.png" />
  <meta name="twitter:image:alt" content="Helsingin seudun Museokalenteri" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />

  <script data-goatcounter="https://museokalenteri.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

  <style>
    :root {
      /* Colors — see DESIGN.md */
      --ink-black: #181818;
      --charcoal: #333333;
      --charcoal-hover: #4a4a4a;
      --charcoal-active: #2a2a2a;
      --paper-fog: #f9f9f9;
      --gallery-white: #ffffff;
      --hairline-gray: #e6e6e6;
      --divider-gray: #f0f0f0;
      --slate: #8a8a8a;
      --body-gray: #454545;
      --meta-gray: #636363;
      --label-gray: #595959;
      --whisper-gray: #c2c2c2;
      --title-gray: #444444;
      --chip-bg: #eeeeee;
      --border-gray: #cccccc;
      --border-hover-gray: #b5b5b5;
      --image-bg: #eef0f1;
      --hover-tint: #f4f4f4;
      --active-tint: #ececec;
      --popup-ink: #222222;
      --popup-meta: #666666;
      --map-link-blue: #1a6fb5;
      --status-current: #047857;
      --status-upcoming: #4338ca;
      --status-opening-soon: #0369a1;
      --status-closing-soon: #b91c1c;
      --status-past: #737373;

      /* Shape */
      --rounded-sm: 4px;
      --rounded-btn: 6px;
      --rounded-md: 8px;
      --rounded-lg: 10px;
      --rounded-pill: 999px;

      /* Spacing */
      --space-xs: 0.35rem;
      --space-sm: 0.5rem;
      --space-md: 0.75rem;
      --space-lg: 1rem;
      --space-xl: 1.5rem;
      --space-2xl: 2rem;

      /* Touch target floor */
      --touch-min: 44px;

      /* Elevation */
      --shadow-ambient-panel: 0 1px 2px rgba(0,0,0,0.03);
      --shadow-ambient-rest: 0 1px 3px rgba(0,0,0,0.07);
      --shadow-hover-lift: 0 6px 20px rgba(0,0,0,0.08);
      --shadow-action-rest: 0 2px 4px rgba(0,0,0,0.08);
      --shadow-action-hover: 0 4px 10px rgba(0,0,0,0.12);
      --shadow-fullscreen-btn: 0 1px 4px rgba(0,0,0,0.15);
      --shadow-image-inset: inset 0 0 0 1px rgba(0,0,0,0.05);
      --shadow-drawer: -4px 0 16px rgba(0,0,0,0.18);
      --overlay-backdrop: rgba(0,0,0,0.35);
    }
    * { box-sizing: border-box; }
    body { font-family: Roboto, Arial, sans-serif; padding: var(--space-2xl); max-width: 980px; margin: auto; background: var(--paper-fog); }
    .page-layout { display: flex; gap: var(--space-xl); align-items: flex-start; }
    .sidebar { flex: 0 0 240px; width: 240px; display: flex; flex-direction: column; gap: var(--space-lg); }
    .main-content { flex: 1; min-width: 0; }
    .sidebar .filter-bar { flex-direction: column; gap: var(--space-xs); margin-bottom: 0; }
    .sidebar .filter-btn { text-align: left; width: 100%; }
    .sidebar #museum-select { width: 100%; min-width: unset; max-width: unset; }
    .sidebar #sort-select { width: 100%; min-width: unset; }
    h1 { text-align: center; font-size: 2rem; margin-bottom: var(--space-2xl); }
    .logo-wrapper { background-color: var(--gallery-white); padding: var(--space-lg); border-radius: var(--rounded-md); display: inline-block; margin: 0 auto; }
    .logo { display: block; max-width: 100%; height: auto; margin: 0 auto; max-height: 300px; object-fit: contain; }
    .section.header { padding: var(--space-md) var(--space-md) 0; }
    .filter-bar, .museum-filter-bar { margin-bottom: var(--space-lg); display: flex; flex-wrap: wrap; gap: var(--space-sm); }
    .filter-btn, .museum-btn { padding: var(--space-sm) var(--space-lg); font-size: 0.85rem; border: none; border-radius: var(--rounded-sm); cursor: pointer; background-color: var(--chip-bg); min-height: var(--touch-min); display: inline-flex; align-items: center; }
    .filter-btn.active, .museum-btn.active { background-color: var(--charcoal); color: var(--gallery-white); }
    .filter-btn::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: var(--space-sm); vertical-align: middle; background: var(--slate); }
    .filter-btn[data-filter="ALL"]::before { display: none; }
    .filter-btn[data-filter="CURRENT"]::before { background: var(--status-current); }
    .filter-btn[data-filter="UPCOMING"]::before { background: var(--status-upcoming); }
    .filter-btn[data-filter="PAST"]::before { background: var(--status-past); }
    .filter-btn[data-filter="OPENING_SOON"]::before { background: var(--status-opening-soon); }
    .filter-btn[data-filter="CLOSING_SOON"]::before { background: var(--status-closing-soon); }
    .museum-filter-bar { flex-direction: column; align-items: stretch; }
    .museum-btn.special { background-color: var(--charcoal); color: var(--gallery-white); width: 100%; text-align: center; justify-content: center; box-shadow: var(--shadow-action-rest); transition: background-color 0.2s ease, box-shadow 0.2s ease; }
    .museum-btn.special:hover { background-color: var(--charcoal-hover); box-shadow: var(--shadow-action-hover); }
    .museum-btn.special:active { background-color: var(--charcoal-active); }
    #results-status-bar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-md); flex-wrap: wrap; padding: 0.6rem 0.85rem; margin: 0.25rem 0 var(--space-sm); background: var(--gallery-white); border: 1px solid var(--hairline-gray); border-radius: var(--rounded-md); box-shadow: var(--shadow-ambient-panel); }
    .results-count { margin: 0; font-size: 0.9rem; color: var(--charcoal); }
    .results-count strong { color: var(--ink-black); }
    #reset-filters-btn { display: none; align-items: center; gap: 0.4rem; padding: 0.4rem 0.8rem; font-size: 0.82rem; font-weight: 500; border: 1px solid var(--border-gray); border-radius: var(--rounded-btn); background: var(--gallery-white); color: var(--charcoal); white-space: nowrap; cursor: pointer; min-height: var(--touch-min); transition: background-color 0.15s ease, border-color 0.15s ease; }
    #reset-filters-btn:hover { background: var(--hover-tint); border-color: var(--border-hover-gray); }
    #reset-filters-btn:active { background: var(--active-tint); }
    #results-status-bar.filtered #reset-filters-btn { display: inline-flex; }
    #exhibitionList { display: flex; flex-direction: column; gap: var(--space-md); }
    .exhibition { background: var(--gallery-white); margin: 0; padding: 0.95rem 1.05rem 1rem 0.95rem; border-left: 4px solid var(--slate); border-radius: var(--rounded-lg); display: block; position: relative; text-decoration: none; color: inherit; font-family: Roboto, Arial, sans-serif; box-shadow: var(--shadow-ambient-rest); transition: box-shadow 0.2s ease, transform 0.2s ease; overflow: hidden; }
    .exhibition:hover { box-shadow: var(--shadow-hover-lift); transform: translateY(-2px); }
    .exhibition:focus-visible { outline: 2px solid var(--charcoal); outline-offset: 4px; }
    .CURRENT { border-left-color: var(--status-current); }
    .UPCOMING { border-left-color: var(--status-upcoming); }
    .PAST { border-left-color: var(--status-past); }
    .OPENING_SOON { border-left-color: var(--status-opening-soon); }
    .CLOSING_SOON { border-left-color: var(--status-closing-soon); }
    .exhibition-row { display: flex; gap: 0.95rem; align-items: flex-start; }
    .exhibition-rail { flex: 0 0 96px; width: 96px; display: flex; flex-direction: column; gap: var(--space-sm); align-items: flex-start; }
    .exhibition-image { width: 96px; height: 96px; border-radius: var(--rounded-md); overflow: hidden; background: var(--image-bg); box-shadow: var(--shadow-image-inset); display: flex; align-items: center; justify-content: center; }
    .exhibition-image img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
    .image-marker-fallback { width: 48px; height: 48px; object-fit: contain; opacity: 0.45; }
    .image-placeholder-text { display: block; width: 100%; text-align: center; font-size: 38px; font-weight: 700; color: rgba(0,0,0,0.25); }
    .status-pill { display: inline-block; white-space: nowrap; padding: 0.18rem 0.55rem; font-size: 0.7rem; font-weight: 700; border-radius: var(--rounded-pill); color: var(--gallery-white); background: var(--slate); }
    .CURRENT .status-pill { background: var(--status-current); }
    .UPCOMING .status-pill { background: var(--status-upcoming); }
    .PAST .status-pill { background: var(--status-past); }
    .OPENING_SOON .status-pill { background: var(--status-opening-soon); }
    .CLOSING_SOON .status-pill { background: var(--status-closing-soon); }
    .exhibition-content { flex: 1; min-width: 0; padding-right: 1.2rem; }
    .exhibition-content h2 { margin: 0 0 0.25rem 0; font-size: 1.12rem; font-weight: 700; line-height: 1.25; color: var(--ink-black); text-wrap: pretty; }
    .exhibition-museum { margin: 0 0 0.28rem 0; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--label-gray); }
    .exhibition-dates { margin: 0; font-size: 0.88rem; color: var(--meta-gray); }
    .exhibition-description { margin: 0.8rem 0 0 0; padding-top: 0.8rem; border-top: 1px solid var(--divider-gray); font-size: 0.9rem; line-height: 1.55; color: var(--body-gray); text-wrap: pretty; }
    .exhibition-link-indicator { position: absolute; top: 0.7rem; right: 0.85rem; color: var(--whisper-gray); font-size: 1.05rem; line-height: 1; }
    .section { background: var(--gallery-white); border: 1px solid var(--hairline-gray); border-radius: var(--rounded-md); padding: var(--space-lg); box-shadow: var(--shadow-ambient-panel); margin-bottom: var(--space-lg); }
    .section.header { text-align: center; }
    .section.header .logo-wrapper { margin-bottom: var(--space-lg); }
    .section .section-title { margin: 0 0 var(--space-sm) 0; font-size: 0.95rem; color: var(--title-gray); font-weight: 600; }
    .controls-row { display: flex; flex-wrap: wrap; gap: var(--space-md); align-items: center; }

    /* Checkbox-museolista */
    .museum-checkbox-item { display: flex; align-items: center; gap: var(--space-sm); padding: 0.85rem 0; border-bottom: 1px solid var(--divider-gray); cursor: pointer; font-size: 0.85rem; }
    .museum-checkbox-item:last-child { border-bottom: none; }
    .museum-checkbox-item input[type="checkbox"] { cursor: pointer; width: 15px; height: 15px; flex-shrink: 0; accent-color: var(--charcoal); }
    .museum-checkbox-item label { cursor: pointer; flex: 1; line-height: 1.3; }
    #map-section { position: relative; }
    #map {
      width: 100%;
      height: 420px;
      border-radius: var(--rounded-btn);
      border: 1px solid var(--hairline-gray);
      transition: border-radius 0.2s;
    }
    .map-canvas { position: relative; }
    #map-fullscreen-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 1000;
      background: var(--gallery-white);
      border: 1px solid var(--border-gray);
      border-radius: var(--rounded-sm);
      width: 30px;
      height: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-fullscreen-btn);
      padding: 0;
    }
    #map-fullscreen-btn:hover { background: var(--hover-tint); }
    #map-fullscreen-btn svg { width: 16px; height: 16px; display: block; }

    /* Koko näyttö -tila */
    .map-fullscreen #map-section {
      position: fixed;
      inset: 0;
      z-index: 9999;
      margin: 0;
      padding: 0;
      border-radius: 0;
      border: none;
      background: var(--gallery-white);
    }
    .map-fullscreen #map {
      height: 100vh !important;
      border-radius: 0;
      border: none;
    }

    /* Popup */
    .popup-title { font-size: 13px; font-weight: 700; margin: 0 0 4px; color: var(--popup-ink); }
    .popup-address { font-size: 12px; color: var(--popup-meta); margin: 0 0 6px; }
    .popup-link { font-size: 12px; color: var(--map-link-blue); text-decoration: none; }
    .popup-link:hover { text-decoration: underline; }

    /* Desktop: piilota mobiilinapit */
    #rajaukset-btn { display: none; }
    #sulje-btn { display: none; }
    #sidebar-overlay { display: none !important; }

    @media (max-width: 768px) {
      body { padding: var(--space-md); }

      /* Header mobiilissa: logo vasemmalle, Rajaukset-nappi oikealle */
      .section.header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.5rem 0.75rem;
        text-align: left;
      }
      .section.header .logo-wrapper {
        padding: 0.4rem 0.6rem;
        margin: 0;
      }
      .logo { max-height: 225px; }
      #rajaukset-btn { display: flex; }

      /* Sivupalkki drawer */
      .sidebar {
        position: fixed;
        top: 0; right: 0;
        width: 280px;
        height: 100%;
        background: var(--paper-fog);
        z-index: 10000;
        overflow-y: auto;
        padding: var(--space-lg);
        box-shadow: var(--shadow-drawer);
        transform: translateX(110%);
        transition: transform 0.25s ease;
        flex: unset;
        display: flex;
        flex-direction: column;
        gap: var(--space-lg);
      }
      .sidebar.open { transform: translateX(0); }

      /* Overlay */
      #sidebar-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: var(--overlay-backdrop);
        z-index: 9999;
      }
      #sidebar-overlay.open { display: block; }

      /* Sulje-nappi sivupalkissa */
      #sulje-btn { display: flex; }

      .page-layout { flex-direction: column; }
      .exhibition-rail { flex-basis: 80px; width: 80px; }
      .exhibition-image { width: 80px; height: 80px; }
      #map { height: 300px; }
    }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  </style>
</head>
<body>

  <header class="section header">
    <h1 class="visually-hidden">Helsingin seudun Museokalenteri</h1>
    <div class="logo-wrapper">
      <img src="./img/museokalenteri_logo_wide.png" alt="Helsingin seudun Museokalenteri" class="logo" />
    </div>
    <button id="rajaukset-btn" style="align-items:center; gap:0.4rem; padding:0.45rem 0.8rem; font-size:0.85rem; border:1px solid var(--border-gray); border-radius:var(--rounded-btn); background:var(--gallery-white); cursor:pointer; font-weight:500; min-height:var(--touch-min);">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px;flex-shrink:0;"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
      Rajaukset
    </button>
  </header>

  <div id="sidebar-overlay" aria-hidden="true"></div>

  <main class="page-layout">

    <!-- PÄÄSISÄLTÖ -->
    <div class="main-content">

      <!-- KARTTA -->
      <div class="section" id="map-section">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:0.5rem;">
          <p class="section-title" id="map-section-title" style="margin:0;">Valitut museot kartalla</p>
          <button id="map-toggle-btn" style="font-size:0.8rem; padding:0.25rem 0.6rem; border:1px solid var(--border-gray); border-radius:var(--rounded-sm); background:var(--gallery-white); cursor:pointer; min-height:var(--touch-min); display:inline-flex; align-items:center;">Piilota kartta</button>
        </div>
        <div class="map-canvas">
          <button id="map-fullscreen-btn" title="Koko näyttö">
            <svg id="icon-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
            </svg>
            <svg id="icon-collapse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
              <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 0 2 2v3"/>
            </svg>
          </button>
          <div id="map"></div>
        </div>
      </div>

      <div id="results-status-bar">
        <p id="results-count" class="results-count" aria-live="polite" aria-atomic="true"></p>
        <button id="reset-filters-btn" type="button">Nollaa suodattimet</button>
      </div>

      <div id="exhibitionList"></div>

    </div><!-- /.main-content -->

    <!-- SIVUPALKKI -->
    <aside class="sidebar" aria-label="Rajaukset">

      <button id="sulje-btn" style="align-items:center; justify-content:space-between; width:100%; padding:0.45rem 0.8rem; font-size:0.85rem; border:1px solid var(--border-gray); border-radius:var(--rounded-btn); background:var(--gallery-white); cursor:pointer; font-weight:500; margin-bottom:0.25rem; min-height:var(--touch-min);">
        Sulje
        <span style="font-size:1.1rem; line-height:1;">&#x2715;</span>
      </button>

      <div class="section">
        <p class="section-title">Aikasuodattimet</p>
        <div class="filter-bar" role="group" aria-label="Aikasuodattimet">
          <button class="filter-btn active" data-filter="ALL" aria-pressed="true">Kaikki</button>
          <button class="filter-btn" data-filter="UPCOMING" aria-pressed="false">Tulossa</button>
          <button class="filter-btn" data-filter="OPENING_SOON" aria-pressed="false">Aukeaa pian</button>
          <button class="filter-btn" data-filter="CURRENT" aria-pressed="false">Käynnissä</button>
          <button class="filter-btn" data-filter="CLOSING_SOON" aria-pressed="false">Päättyy pian</button>
          <button class="filter-btn" data-filter="PAST" aria-pressed="false">Päättyneet</button>
        </div>
      </div>

      <div class="section">
        <p class="section-title">Museot</p>
        <div class="museum-filter-bar" style="margin:0 0 0.5rem;">
          <button id="select-all-museums" class="museum-btn special">Valitse kaikki</button>
          <button id="deselect-all-museums" class="museum-btn special" style="margin-top:0.35rem;">Poista valinnat</button>
        </div>
        <div id="museum-checkbox-list"></div>
      </div>

      <div class="section">
        <p class="section-title">Järjestys</p>
        <select id="sort-select" aria-label="Järjestä lista" style="width:100%; padding:0.4rem 0.6rem;">
          <option value="MUSEUM">Museon mukaan</option>
          <option value="TITLE">Näyttelyn nimen mukaan</option>
          <option value="CLOSING_DATE">Päättymispäivän mukaan</option>
          <option value="OPENING_DATE" selected>Avautumispäivän mukaan</option>
        </select>
      </div>

      <div class="section" style="margin-bottom:0;">
        <p id="today" style="margin:0 0 0.2rem; color:var(--charcoal); font-size:0.8rem;"></p>
        <p id="last-updated" style="margin:0; color:var(--charcoal); font-size:0.8rem;"></p>
      </div>

    </aside>

  </main><!-- /.page-layout -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script>

  // Museotiedot haetaan museot.json:sta
  let museumData = {};
  const museoDataPromise = fetch('./museot.json')
    .then(res => res.json())
    .then(data => { data.forEach(m => { museumData[m.nimi] = m; }); })
    .catch(() => {});

  // Mustavalkoinen markkeri-SVG
  const markerSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="32" height="32">
    <rect x="10" y="30" width="180" height="155" rx="28" ry="28" fill="white" stroke="black" stroke-width="16"/>
    <rect x="50" y="10" width="22" height="44" rx="11" ry="11" fill="white" stroke="black" stroke-width="14"/>
    <rect x="128" y="10" width="22" height="44" rx="11" ry="11" fill="white" stroke="black" stroke-width="14"/>
    <polygon points="100,58 158,88 42,88" fill="none" stroke="black" stroke-width="12" stroke-linejoin="round"/>
    <rect x="42" y="85" width="116" height="11" fill="black"/>
    <rect x="55" y="96" width="12" height="50" fill="black"/>
    <rect x="75" y="96" width="12" height="50" fill="black"/>
    <rect x="95" y="96" width="12" height="50" fill="black"/>
    <rect x="115" y="96" width="12" height="50" fill="black"/>
    <rect x="135" y="96" width="12" height="50" fill="black"/>
    <rect x="38" y="146" width="124" height="10" fill="black"/>
    <rect x="32" y="157" width="136" height="10" fill="black"/>
  </svg>`;

  const markerIcon = L.divIcon({
    html: markerSvg,
    className: '',
    iconSize: [32, 32],
    iconAnchor: [16, 16],
    popupAnchor: [0, -20]
  });

  // Kartta
  const map = L.map('map').setView([60.1680, 24.9200], 12);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors © <a href="https://carto.com/">CARTO</a>',
    maxZoom: 19
  }).addTo(map);

  // Markkerikerros – päivitetään museovalinnan mukaan
  let markerLayer = L.layerGroup().addTo(map);

  function parseDate(s) {
    if (!s) return new Date(NaN);
    if (s.includes('.')) {
      const [d, m, y] = s.split('.').map(Number);
      return new Date(Date.UTC(y, m - 1, d));
    }
    const [y, m, d] = s.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, d));
  }

  function computeStatus(ex) {
    const now = new Date();
    const start = parseDate(ex.start);
    const end   = parseDate(ex.end);
    const in2w = new Date(now.getTime() + 14 * 24 * 60 * 60 * 1000);
    if (start <= now && end >= now) {
      if (end <= in2w) return "CLOSING_SOON";
      return "CURRENT";
    }
    if (start > now) {
      if (start <= in2w) return "OPENING_SOON";
      return "UPCOMING";
    }
    return "PAST";
  }

  function statusLabel(s) {
    return { CURRENT: "Käynnissä", UPCOMING: "Tulossa", PAST: "Päättynyt", OPENING_SOON: "Aukeaa pian", CLOSING_SOON: "Päättyy pian" }[s] || s;
  }

  function formatDate(s) {
    if (!s) return "";
    return parseDate(s).toLocaleDateString('fi-FI', { day: 'numeric', month: 'numeric', year: 'numeric' });
  }

  function updateMap(activeMuseums, allExhibitions) {
    markerLayer.clearLayers();
    activeMuseums.forEach(museumName => {
      const info = museumData[museumName];
      if (!info || !info.lat || !info.lng) return;
      const popupHtml = `
        <p class="popup-title">${museumName}</p>
        <p class="popup-address">${info.osoite || ''}</p>
        <a class="popup-link" href="${info.kotisivu}" target="_blank" rel="noopener">Museon verkkosivut →</a>
      `;
      L.marker([info.lat, info.lng], { icon: markerIcon, title: museumName })
        .on('add', function() { this.getElement()?.setAttribute('aria-label', museumName); })
        .addTo(markerLayer)
        .bindPopup(popupHtml, { maxWidth: 240 });
    });
  }

  // ------- Alkuperäinen kalenteri-logiikka -------

  let exhibitions = [];

  (function setTodayDate() {
    const el = document.getElementById('today');
    if (el) {
      const f = new Date().toLocaleDateString('fi-FI', { year: 'numeric', month: 'long', day: 'numeric' });
      el.textContent = `Tänään on ${f}`;
    }
  })();

  fetch('./museonayttelyt_meta.json')
    .then(res => res.ok ? res.json() : null)
    .then(meta => { if (meta && meta.createdAt) updateLastUpdated(meta.createdAt); })
    .catch(() => {});

  const nayttelytPromise = fetch('./museonayttelyt.json')
    .then(async res => {
      const lastModified = res.headers ? res.headers.get('Last-Modified') : null;
      const data = await res.json();
      return { data, lastModified };
    });

  Promise.all([nayttelytPromise, museoDataPromise])
    .then(([{ data, lastModified }]) => {
      exhibitions = data;
      const el = document.getElementById('last-updated');
      if (el && !el.textContent && lastModified) updateLastUpdated(lastModified);
      initExhibitions();
    })
    .catch(err => {
      document.getElementById("exhibitionList").innerHTML =
        "<p style='color:red'>Virhe ladattaessa museonayttelyt.json: " + err.message + "</p>";
    });

  function initExhibitions() {
    const museumSet = Array.from(new Set(exhibitions.map(ex => ex.museum))).sort();

    // Rakennetaan checkbox-lista
    const checkboxContainer = document.getElementById('museum-checkbox-list');
    if (checkboxContainer) {
      checkboxContainer.innerHTML = '';
      museumSet.forEach(museum => {
        const id = 'cb-' + museum.replace(/\s+/g, '-');
        const item = document.createElement('div');
        item.className = 'museum-checkbox-item';
        item.innerHTML = `<input type="checkbox" id="${id}" value="${museum}" checked><label for="${id}">${museum}</label>`;
        checkboxContainer.appendChild(item);
      });
    }

    function getCheckedMuseums() {
      return new Set(
        Array.from(document.querySelectorAll('#museum-checkbox-list input[type="checkbox"]:checked'))
          .map(cb => cb.value)
      );
    }

    const container = document.getElementById("exhibitionList");
    const statusButtons = document.querySelectorAll(".filter-btn");
    const selectAllBtn = document.getElementById("select-all-museums");
    const deselectAllBtn = document.getElementById("deselect-all-museums");
    const sortSelect = document.getElementById("sort-select");
    let activeMuseums = new Set(museumSet);
    let activeStatus = "ALL";

    const resultsBar      = document.getElementById("results-status-bar");
    const resultsCount    = document.getElementById("results-count");
    const resetFiltersBtn = document.getElementById("reset-filters-btn");
    let activeSort = sortSelect ? sortSelect.value : "OPENING_DATE";

    // Alkupiirto kartalle
    updateMap(activeMuseums, exhibitions);

    function getFilteredExhibitions(statusType) {
      const now = new Date();
      const in2w = new Date(now.getTime() + 14 * 24 * 60 * 60 * 1000);
      return exhibitions.filter(ex => {
        if (!activeMuseums.has(ex.museum)) return false;
        if (statusType === "CURRENT" || statusType === "UPCOMING" || statusType === "PAST")
          return computeStatus(ex) === statusType;
        if (statusType === "ALL") return true;
        if (statusType === "OPENING_SOON") {
          const start = parseDate(ex.start);
          return start >= now && start <= in2w;
        }
        if (statusType === "CLOSING_SOON") {
          const end = parseDate(ex.end);
          return end >= now && end <= in2w;
        }
        return true;
      });
    }

    function sortExhibitions(list) {
      const copy = [...list];
      const byStr  = (a, b, fn) => (fn(a)||"").toString().toLowerCase().localeCompare((fn(b)||"").toString().toLowerCase());
      const byDate = (a, b, fn) => { const va = parseDate(fn(a)); const vb = parseDate(fn(b)); return (isNaN(va)?Infinity:va) - (isNaN(vb)?Infinity:vb); };
      switch (activeSort) {
        case "MUSEUM":       copy.sort((a,b) => byStr(a,b,e=>e.museum)); break;
        case "TITLE":        copy.sort((a,b) => byStr(a,b,e=>e.title)); break;
        case "CLOSING_DATE": copy.sort((a,b) => byDate(a,b,e=>e.end)); break;
        default:             copy.sort((a,b) => byDate(a,b,e=>e.start)); break;
      }
      return copy;
    }

    function getStatusLabel(s) {
      return { CURRENT:'Käynnissä', UPCOMING:'Tulossa', PAST:'Päättynyt', OPENING_SOON:'Aukeaa pian', CLOSING_SOON:'Päättyy pian', UNKNOWN:'Tuntematon' }[s] || s;
    }

    function tryLoadImage(url) {
      return new Promise(resolve => {
        const img = new Image();
        img.onload = () => resolve(true);
        img.onerror = () => resolve(false);
        img.src = url;
      });
    }

    function renderExhibitions(list) {
      container.innerHTML = "";
      if (list.length === 0) {
        container.innerHTML = "<p style='color:#555'>Suodattimillasi ei löydy näyttelyitä.</p>";
        return;
      }
      list.forEach(ex => {
        const st = computeStatus(ex);
        const linkUrl  = ex.Link || ex.link || "";
        const imageUrl = ex.Image || ex.image || "";
        const card = document.createElement(linkUrl ? "a" : "div");
        card.className = `exhibition ${st}`;
        if (linkUrl) { card.href = linkUrl; card.target = "_blank"; card.rel = "noopener noreferrer"; }
        const descHtml = ex.description && ex.description.trim() ? `<p class="exhibition-description">${ex.description}</p>` : '';
        const linkIndicator = linkUrl ? `<span class="exhibition-link-indicator" aria-hidden="true">\u2197</span>` : '';
        card.innerHTML = `
          ${linkIndicator}
          <div class="exhibition-row">
            <div class="exhibition-rail">
              <div class="exhibition-image"><img src="./img/museokalenteri_museo.marker.png" alt="" class="image-marker-fallback" /></div>
              <span class="status-pill">${getStatusLabel(st)}</span>
            </div>
            <div class="exhibition-content">
              <p class="exhibition-museum">${ex.museum}</p>
              <h2>${ex.title}</h2>
              <p class="exhibition-dates">${formatDate(ex.start)} \u2013 ${formatDate(ex.end)}</p>
              ${descHtml}
            </div>
          </div>`;
        container.appendChild(card);
        if (imageUrl) {
          const imgContainer = card.querySelector('.exhibition-image');
          tryLoadImage(imageUrl).then(ok => {
            if (ok && imgContainer) {
              const realImg = document.createElement('img');
              realImg.src = imageUrl;
              realImg.alt = ex.title;
              imgContainer.innerHTML = '';
              imgContainer.appendChild(realImg);
            }
          });
        }
      });
    }
    function updateStatusCounts() {
      const counts = { ALL:0, CURRENT:0, UPCOMING:0, PAST:0, OPENING_SOON:0, CLOSING_SOON:0 };
      exhibitions.forEach(ex => {
        if (!activeMuseums.has(ex.museum)) return;
        counts.ALL++;
        const st = computeStatus(ex);
        if (st in counts) counts[st]++;
      });
      statusButtons.forEach(btn => {
        const t = btn.dataset.filter;
        btn.textContent = btn.textContent.replace(/ \(\d+\)$/, '') + ` (${counts[t]})`;
      });
    }

    function applyFilter(statusType) {
      activeStatus = statusType;
      const filtered = getFilteredExhibitions(statusType);
      const sorted   = sortExhibitions(filtered);
      renderExhibitions(sorted);
      statusButtons.forEach(btn => { btn.classList.remove("active"); btn.setAttribute("aria-pressed", "false"); });
      const activeBtn = document.querySelector(`[data-filter="${statusType}"]`);
      activeBtn.classList.add("active");
      activeBtn.setAttribute("aria-pressed", "true");
      updateStatusCounts();
      updateResultsBar(sorted.length);
    }

    function updateResultsBar(shown) {
      if (!resultsBar || !resultsCount) return;
      const total = exhibitions.length;
      const filtersActive = activeStatus !== "ALL" || activeMuseums.size !== museumSet.length;
      resultsCount.innerHTML = `Näytetään <strong>${shown}</strong> / ${total} näyttelyä`;
      resultsBar.classList.toggle("filtered", filtersActive);
    }

    function resetFilters() {
      activeStatus = "ALL";
      activeMuseums = new Set(museumSet);
      document.querySelectorAll('#museum-checkbox-list input[type="checkbox"]').forEach(cb => cb.checked = true);
      updateMap(activeMuseums, exhibitions);
      applyFilter("ALL");
    }

    if (resetFiltersBtn) resetFiltersBtn.addEventListener("click", resetFilters);

    function syncMuseums() {
      activeMuseums = getCheckedMuseums();
      updateMap(activeMuseums, exhibitions);
      applyFilter(activeStatus);
    }

    if (checkboxContainer) {
      checkboxContainer.addEventListener('change', syncMuseums);
    }

    selectAllBtn.addEventListener("click", () => {
      document.querySelectorAll('#museum-checkbox-list input[type="checkbox"]').forEach(cb => cb.checked = true);
      activeMuseums = new Set(museumSet);
      updateMap(activeMuseums, exhibitions);
      applyFilter(activeStatus);
    });

    deselectAllBtn.addEventListener("click", () => {
      document.querySelectorAll('#museum-checkbox-list input[type="checkbox"]').forEach(cb => cb.checked = false);
      activeMuseums = new Set();
      updateMap(activeMuseums, exhibitions);
      applyFilter(activeStatus);
    });

    statusButtons.forEach(btn => btn.addEventListener("click", () => applyFilter(btn.dataset.filter)));

    if (sortSelect) {
      sortSelect.addEventListener("change", () => {
        activeSort = sortSelect.value;
        applyFilter(activeStatus);
      });
    }

    updateStatusCounts();
    applyFilter("ALL");
  }

  function updateLastUpdated(header) {
    const el = document.getElementById('last-updated');
    if (!el) return;
    const d = new Date(header);
    if (isNaN(d)) return;
    el.textContent = `Tiedot päivitetty: ${d.toLocaleDateString('fi-FI', { year:'numeric', month:'long', day:'numeric' })}`;
  }

  // Mobiili-drawer
  const rajauksetBtn = document.getElementById('rajaukset-btn');
  const suljeBtn = document.getElementById('sulje-btn');
  const sidebar = document.querySelector('.sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  const headerEl = document.querySelector('header.section');
  const mainContentEl = document.querySelector('.main-content');

  function onDrawerKeydown(e) {
    if (e.key === 'Escape') closeDrawer();
  }

  function openDrawer() {
    sidebar.classList.add('open');
    overlay.classList.add('open');
    sidebar.setAttribute('role', 'dialog');
    sidebar.setAttribute('aria-modal', 'true');
    headerEl.setAttribute('inert', '');
    mainContentEl.setAttribute('inert', '');
    document.addEventListener('keydown', onDrawerKeydown);
    suljeBtn.focus();
  }
  function closeDrawer() {
    sidebar.classList.remove('open');
    overlay.classList.remove('open');
    sidebar.removeAttribute('role');
    sidebar.removeAttribute('aria-modal');
    headerEl.removeAttribute('inert');
    mainContentEl.removeAttribute('inert');
    document.removeEventListener('keydown', onDrawerKeydown);
    rajauksetBtn.focus();
  }
  rajauksetBtn.addEventListener('click', openDrawer);
  suljeBtn.addEventListener('click', closeDrawer);
  overlay.addEventListener('click', closeDrawer);

  // Kartan piilota/näytä
  const mapToggleBtn = document.getElementById('map-toggle-btn');
  const mapEl = document.getElementById('map');
  const mapSectionTitle = document.getElementById('map-section-title');
  const mapFullscreenBtn = document.getElementById('map-fullscreen-btn');
  let mapVisible = true;
  mapToggleBtn.addEventListener('click', () => {
    mapVisible = !mapVisible;
    mapEl.style.display = mapVisible ? '' : 'none';
    mapFullscreenBtn.style.display = mapVisible ? '' : 'none';
    mapSectionTitle.style.display = mapVisible ? '' : 'none';
    mapToggleBtn.textContent = mapVisible ? 'Piilota kartta' : 'Näytä kartta';
    if (mapVisible) setTimeout(() => map.invalidateSize(), 50);
  });

  // Kartan koko näyttö -toiminto
  document.getElementById('map-fullscreen-btn').addEventListener('click', () => {
    const isFullscreen = document.body.classList.toggle('map-fullscreen');
    document.getElementById('icon-expand').style.display  = isFullscreen ? 'none'  : 'block';
    document.getElementById('icon-collapse').style.display = isFullscreen ? 'block' : 'none';
    setTimeout(() => map.invalidateSize(), 200);
  });

  </script>
</body>
</html>
