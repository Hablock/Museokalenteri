  <script type="application/json" id="embedded-meta">
{
  "createdAt": "2026-05-21"

  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script>

  // Lukee upotetun JSON-datan annetusta <script>-lohkosta
  function readEmbedded(id) {
    const el = document.getElementById(id);
    if (!el) return null;
    try { return JSON.parse(el.textContent); } catch (e) { return null; }
  }

  // Hakee JSON:n fetchillä; jos se epäonnistuu (esim. Claude Design
  // -ympäristö ilman tiedostojärjestelmää), palautetaan upotettu data.
  async function loadJson(url, embeddedId) {
    try {
      const res = await fetch(url);
      if (res.ok) return await res.json();
    } catch (e) { /* fallback alla */ }
    return readEmbedded(embeddedId);
  }

  // Museotiedot haetaan museot.json:sta (fallback: upotettu data)
  let museumData = {};
  const museoDataPromise = loadJson('./museot.json', 'embedded-museot')
    .then(data => { if (data) data.forEach(m => { museumData[m.nimi] = m; }); })
    .catch(() => {});

  // Mustavalkoinen markkeri-SVG
  const markerSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="32" height="32">
    <rect x="10" y="30" width="180" height="155" rx="28" ry="28" fill="white" stroke="black" stroke-width="16"/>
    <rect x="50" y="10" width="22" height="44" rx="11" ry="11" fill="white" stroke="black" stroke-width="14"/>
    <rect x="128" y="10" width="22" height="44" rx="11" ry="11" fill="white" stroke="black" stroke-width="14"/>
    <polygon points="100,58 158,88 42,88" fill="none" stroke="black" stroke-width="12" stroke-linejoin="round"/>
    <rect x="42" y="85" width="116" height="11" fill="black"/>
    <rect x="55" y="96" width="12" height="50" fill="black"/>
    <rect x="75" y="96" width="12" height="50" fill="black"/>
    <rect x="95" y="96" width="12" height="50" fill="black"/>
    <rect x="115" y="96" width="12" height="50" fill="black"/>
    <rect x="135" y="96" width="12" height="50" fill="black"/>
    <rect x="38" y="146" width="124" height="10" fill="black"/>
    <rect x="32" y="157" width="136" height="10" fill="black"/>
  </svg>`;

  const markerIcon = L.divIcon({
    html: markerSvg,
    className: '',
    iconSize: [32, 32],
    iconAnchor: [16, 16],
    popupAnchor: [0, -20]
  });

  // Kartta
  const map = L.map('map').setView([60.1680, 24.9200], 12);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors © <a href="https://carto.com/">CARTO</a>',
    maxZoom: 19
  }).addTo(map);

  // Markkerikerros – päivitetään museovalinnan mukaan
  let markerLayer = L.layerGroup().addTo(map);

  function parseDate(s) {
    if (!s) return new Date(NaN);
    if (s.includes('.')) {
      const [d, m, y] = s.split('.').map(Number);
      return new Date(Date.UTC(y, m - 1, d));
    }
    const [y, m, d] = s.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, d));
  }

  function computeStatus(ex) {
    const now = new Date();
    const start = parseDate(ex.start);
    const end   = parseDate(ex.end);
    const in2w = new Date(now.getTime() + 14 * 24 * 60 * 60 * 1000);
    if (start <= now && end >= now) {
      if (end <= in2w) return "CLOSING_SOON";
      return "CURRENT";
    }
    if (start > now) {
      if (start <= in2w) return "OPENING_SOON";
      return "UPCOMING";
    }
    return "PAST";
  }

  function statusLabel(s) {
    return { CURRENT: "Käynnissä", UPCOMING: "Tulossa", PAST: "Päättynyt", OPENING_SOON: "Aukeaa pian", CLOSING_SOON: "Päättyy pian" }[s] || s;
  }

  function formatDate(s) {
    if (!s) return "";
    return parseDate(s).toLocaleDateString('fi-FI', { day: 'numeric', month: 'numeric', year: 'numeric' });
  }

  function updateMap(activeMuseums, allExhibitions) {
    markerLayer.clearLayers();
    activeMuseums.forEach(museumName => {
      const info = museumData[museumName];
      if (!info || !info.lat || !info.lng) return;
      const popupHtml = `
        <p class="popup-title">${museumName}</p>
        <p class="popup-address">${info.osoite || ''}</p>
        <a class="popup-link" href="${info.kotisivu}" target="_blank" rel="noopener">Museon verkkosivut →</a>
      `;
      L.marker([info.lat, info.lng], { icon: markerIcon, title: museumName })
        .on('add', function() { this.getElement()?.setAttribute('aria-label', museumName); })
        .addTo(markerLayer)
        .bindPopup(popupHtml, { maxWidth: 240 });
    });
  }

  // ------- Alkuperäinen kalenteri-logiikka -------

  let exhibitions = [];

  (function setTodayDate() {
    const el = document.getElementById('today');
    if (el) {
      const f = new Date().toLocaleDateString('fi-FI', { year: 'numeric', month: 'long', day: 'numeric' });
      el.textContent = `Tänään on ${f}`;
    }
  })();

  loadJson('./museonayttelyt_meta.json', 'embedded-meta')
    .then(meta => { if (meta && meta.createdAt) updateLastUpdated(meta.createdAt); })
    .catch(() => {});

  const nayttelytPromise = (async () => {
    try {
      const res = await fetch('./museonayttelyt.json');
      if (res.ok) {
        const lastModified = res.headers ? res.headers.get('Last-Modified') : null;
        const data = await res.json();
        return { data, lastModified };
      }
    } catch (e) { /* fallback alla */ }
    return { data: readEmbedded('embedded-nayttelyt') || [], lastModified: null };
  })();

  Promise.all([nayttelytPromise, museoDataPromise])
    .then(([{ data, lastModified }]) => {
      exhibitions = data;
      const el = document.getElementById('last-updated');
      if (el && !el.textContent && lastModified) updateLastUpdated(lastModified);
      initExhibitions();
    })
    .catch(err => {
      document.getElementById("exhibitionList").innerHTML =
        "<p style='color:red'>Virhe ladattaessa museonayttelyt.json: " + err.message + "</p>";
    });

  function initExhibitions() {
    const museumSet = Array.from(new Set(exhibitions.map(ex => ex.museum))).sort();

    // Rakennetaan checkbox-lista
    const checkboxContainer = document.getElementById('museum-checkbox-list');
    if (checkboxContainer) {
      checkboxContainer.innerHTML = '';
      museumSet.forEach(museum => {
        const id = 'cb-' + museum.replace(/\s+/g, '-');
        const item = document.createElement('div');
        item.className = 'museum-checkbox-item';
        item.innerHTML = `<input type="checkbox" id="${id}" value="${museum}" checked><label for="${id}">${museum}</label>`;
        checkboxContainer.appendChild(item);
      });
    }

    function getCheckedMuseums() {
      return new Set(
        Array.from(document.querySelectorAll('#museum-checkbox-list input[type="checkbox"]:checked'))
          .map(cb => cb.value)
      );
    }

    const container = document.getElementById("exhibitionList");
    const statusButtons = document.querySelectorAll(".filter-btn");
    const selectAllBtn = document.getElementById("select-all-museums");
    const deselectAllBtn = document.getElementById("deselect-all-museums");
    const sortSelect = document.getElementById("sort-select");
    let activeMuseums = new Set(museumSet);
    let activeStatus = "ALL";

    const resultsBar      = document.getElementById("results-status-bar");
    const resultsCount    = document.getElementById("results-count");
    const resetFiltersBtn = document.getElementById("reset-filters-btn");
    let activeSort = sortSelect ? sortSelect.value : "OPENING_DATE";

    // Alkupiirto kartalle
    updateMap(activeMuseums, exhibitions);

    function getFilteredExhibitions(statusType) {
      const now = new Date();
      const in2w = new Date(now.getTime() + 14 * 24 * 60 * 60 * 1000);
      return exhibitions.filter(ex => {
        if (!activeMuseums.has(ex.museum)) return false;
        if (statusType === "CURRENT" || statusType === "UPCOMING" || statusType === "PAST")
          return computeStatus(ex) === statusType;
        if (statusType === "ALL") return true;
        if (statusType === "OPENING_SOON") {
          const start = parseDate(ex.start);
          return start >= now && start <= in2w;
        }
        if (statusType === "CLOSING_SOON") {
          const end = parseDate(ex.end);
          return end >= now && end <= in2w;
        }
        return true;
      });
    }

    function sortExhibitions(list) {
      const copy = [...list];
      const byStr  = (a, b, fn) => (fn(a)||"").toString().toLowerCase().localeCompare((fn(b)||"").toString().toLowerCase());
      const byDate = (a, b, fn) => { const va = parseDate(fn(a)); const vb = parseDate(fn(b)); return (isNaN(va)?Infinity:va) - (isNaN(vb)?Infinity:vb); };
      switch (activeSort) {
        case "MUSEUM":       copy.sort((a,b) => byStr(a,b,e=>e.museum)); break;
        case "TITLE":        copy.sort((a,b) => byStr(a,b,e=>e.title)); break;
        case "CLOSING_DATE": copy.sort((a,b) => byDate(a,b,e=>e.end)); break;
        default:             copy.sort((a,b) => byDate(a,b,e=>e.start)); break;
      }
      return copy;
    }

    function getStatusLabel(s) {
      return { CURRENT:'Käynnissä', UPCOMING:'Tulossa', PAST:'Päättynyt', OPENING_SOON:'Aukeaa pian', CLOSING_SOON:'Päättyy pian', UNKNOWN:'Tuntematon' }[s] || s;
    }

    function tryLoadImage(url) {
      return new Promise(resolve => {
        const img = new Image();
        img.onload = () => resolve(true);
        img.onerror = () => resolve(false);
        img.src = url;
      });
    }

    function renderExhibitions(list) {
      container.innerHTML = "";
      if (list.length === 0) {
        container.innerHTML = "<p style='color:#555'>Suodattimillasi ei löydy näyttelyitä.</p>";
        return;
      }
      list.forEach(ex => {
        const st = computeStatus(ex);
        const linkUrl  = ex.Link || ex.link || "";
        const imageUrl = ex.Image || ex.image || "";
        const card = document.createElement(linkUrl ? "a" : "div");
        card.className = `exhibition ${st}`;
        if (linkUrl) { card.href = linkUrl; card.target = "_blank"; card.rel = "noopener noreferrer"; }
        const descHtml = ex.description && ex.description.trim() ? `<p class="exhibition-description">${ex.description}</p>` : '';
        const linkIndicator = linkUrl ? `<span class="exhibition-link-indicator" aria-hidden="true">\u2197</span>` : '';
        card.innerHTML = `
          ${linkIndicator}
          <div class="exhibition-row">
            <div class="exhibition-rail">
              <div class="exhibition-image"><img src="./img/museokalenteri_museo.marker.png" alt="" class="image-marker-fallback" /></div>
              <span class="status-pill">${getStatusLabel(st)}</span>
            </div>
            <div class="exhibition-content">
              <p class="exhibition-museum">${ex.museum}</p>
              <h2>${ex.title}</h2>
              <p class="exhibition-dates">${formatDate(ex.start)} \u2013 ${formatDate(ex.end)}</p>
              ${descHtml}
            </div>
          </div>`;
        container.appendChild(card);
        if (imageUrl) {
          const imgContainer = card.querySelector('.exhibition-image');
          tryLoadImage(imageUrl).then(ok => {
            if (ok && imgContainer) {
              const realImg = document.createElement('img');
              realImg.src = imageUrl;
              realImg.alt = ex.title;
              imgContainer.innerHTML = '';
              imgContainer.appendChild(realImg);
            }
          });
        }
      });
    }
    function updateStatusCounts() {
      const counts = { ALL:0, CURRENT:0, UPCOMING:0, PAST:0, OPENING_SOON:0, CLOSING_SOON:0 };
      exhibitions.forEach(ex => {
        if (!activeMuseums.has(ex.museum)) return;
        counts.ALL++;
        const st = computeStatus(ex);
        if (st in counts) counts[st]++;
      });
      statusButtons.forEach(btn => {
        const t = btn.dataset.filter;
        btn.textContent = btn.textContent.replace(/ \(\d+\)$/, '') + ` (${counts[t]})`;
      });
    }

    function applyFilter(statusType) {
      activeStatus = statusType;
      const filtered = getFilteredExhibitions(statusType);
      const sorted   = sortExhibitions(filtered);
      renderExhibitions(sorted);
      statusButtons.forEach(btn => btn.classList.remove("active"));
      document.querySelector(`[data-filter="${statusType}"]`).classList.add("active");
      updateStatusCounts();
      updateResultsBar(sorted.length);
    }

    function updateResultsBar(shown) {
      if (!resultsBar || !resultsCount) return;
      const total = exhibitions.length;
      const filtersActive = activeStatus !== "ALL" || activeMuseums.size !== museumSet.length;
      resultsCount.innerHTML = `Näytetään <strong>${shown}</strong> / ${total} näyttelyä`;
      resultsBar.classList.toggle("filtered", filtersActive);
    }

    function resetFilters() {
      activeStatus = "ALL";
      activeMuseums = new Set(museumSet);
      document.querySelectorAll('#museum-checkbox-list input[type="checkbox"]').forEach(cb => cb.checked = true);
      updateMap(activeMuseums, exhibitions);
      applyFilter("ALL");
    }

    if (resetFiltersBtn) resetFiltersBtn.addEventListener("click", resetFilters);

    function syncMuseums() {
      activeMuseums = getCheckedMuseums();
      updateMap(activeMuseums, exhibitions);
      applyFilter(activeStatus);
    }

    if (checkboxContainer) {
      checkboxContainer.addEventListener('change', syncMuseums);
    }

    selectAllBtn.addEventListener("click", () => {
      document.querySelectorAll('#museum-checkbox-list input[type="checkbox"]').forEach(cb => cb.checked = true);
      activeMuseums = new Set(museumSet);
      updateMap(activeMuseums, exhibitions);
      applyFilter(activeStatus);
    });

    deselectAllBtn.addEventListener("click", () => {
      document.querySelectorAll('#museum-checkbox-list input[type="checkbox"]').forEach(cb => cb.checked = false);
      activeMuseums = new Set();
      updateMap(activeMuseums, exhibitions);
      applyFilter(activeStatus);
    });

    statusButtons.forEach(btn => btn.addEventListener("click", () => applyFilter(btn.dataset.filter)));

    if (sortSelect) {
      sortSelect.addEventListener("change", () => {
        activeSort = sortSelect.value;
        applyFilter(activeStatus);
      });
    }

    updateStatusCounts();
    applyFilter("ALL");
  }

  function updateLastUpdated(header) {
    const el = document.getElementById('last-updated');
    if (!el) return;
    const d = new Date(header);
    if (isNaN(d)) return;
    el.textContent = `Tiedot päivitetty: ${d.toLocaleDateString('fi-FI', { year:'numeric', month:'long', day:'numeric' })}`;
  }

  // Mobiili-drawer
  const rajauksetBtn = document.getElementById('rajaukset-btn');
  const suljeBtn = document.getElementById('sulje-btn');
  const sidebar = document.querySelector('.sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  function openDrawer() { sidebar.classList.add('open'); overlay.classList.add('open'); }
  function closeDrawer() { sidebar.classList.remove('open'); overlay.classList.remove('open'); }
  rajauksetBtn.addEventListener('click', openDrawer);
  suljeBtn.addEventListener('click', closeDrawer);
  overlay.addEventListener('click', closeDrawer);

  // Kartan piilota/näytä
  const mapToggleBtn = document.getElementById('map-toggle-btn');
  const mapEl = document.getElementById('map');
  const mapSectionTitle = document.getElementById('map-section-title');
  const mapFullscreenBtn = document.getElementById('map-fullscreen-btn');
  let mapVisible = true;
  mapToggleBtn.addEventListener('click', () => {
    mapVisible = !mapVisible;
    mapEl.style.display = mapVisible ? '' : 'none';
    mapFullscreenBtn.style.display = mapVisible ? '' : 'none';
    mapSectionTitle.style.display = mapVisible ? '' : 'none';
    mapToggleBtn.textContent = mapVisible ? 'Piilota kartta' : 'Näytä kartta';
    if (mapVisible) setTimeout(() => map.invalidateSize(), 50);
  });

  // Kartan koko näyttö -toiminto
  document.getElementById('map-fullscreen-btn').addEventListener('click', () => {
    const isFullscreen = document.body.classList.toggle('map-fullscreen');
    document.getElementById('icon-expand').style.display  = isFullscreen ? 'none'  : 'block';
    document.getElementById('icon-collapse').style.display = isFullscreen ? 'block' : 'none';
    setTimeout(() => map.invalidateSize(), 200);
  });

  </script>
</body>
</html>
